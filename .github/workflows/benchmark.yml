name: benchmark

# Runs the benchmark of benchmark/ on the self-hosted runner labeled `benchmark` (a machine
# with a CUDA device), with a wall limit of 2 hours per solve: the four sets (ACOPF, COPS,
# Mittelmann, CUTEst) with MadNLP's default configuration, on the host and on the CUDA device
# at the same time.
#
# - A pull request is benchmarked on request: add the `benchmark` label. The run starts at
#   once, without waiting for `build`. While it runs, a comment shows the results so far; at the
#   end it gives the comparison with the archived results of the base commit. A push to a
#   labeled pull request replaces the running benchmark with one of the new commit. A commit
#   with `[benchmark-continue]` in its message, for changes that do not affect the results, leaves
#   a running benchmark as it is; with none running, it takes over the results kept for the pull
#   request and solves what is left.
# - A commit on master is benchmarked when its `build` run succeeds, and archived on the
#   `benchmark-results` branch under <hardware>/<commit>/, which is what a pull request is
#   compared with.
# - Any other set, configuration or revision is run, and optionally archived, by hand
#   (workflow_dispatch).
#
# Same-repository branches only: code from a fork never runs on the self-hosted runner.
# The `benchmark` label names the one runner that takes these jobs, so two benchmarks never
# run at once; timings are comparable only while that runner stays on the same machine. The
# job that runs the benchmark has a read-only token; the archive and the comment are written
# by a separate job that runs the scripts of the default branch on the uploaded result files.

on:
  workflow_run:
    workflows: [build]
    types: [completed]
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      sets:
        description: 'Sets, comma-separated (smoke, acopf, cops, mittelmann, cutest)'
        default: 'smoke'
      config:
        description: 'Configurations, comma-separated (see benchmark/configs.jl)'
        default: 'default'
      device:
        description: 'cpu, cuda, or cpu,cuda for both side by side'
        default: 'cuda'
      archive:
        description: 'Archive the results on the benchmark-results branch'
        type: boolean
        default: false

permissions: {}

env:
  ARCHIVE_BRANCH: benchmark-results
  # wall limit of a solve in seconds; a failure is scored with it, so it is the same for every archived run
  WALL: 7200

jobs:
  # Decide whether to benchmark, and which commit.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    outputs:
      run: ${{ steps.decide.outputs.run }}
      commit: ${{ steps.decide.outputs.commit }}
      pr: ${{ steps.decide.outputs.pr }}
      base: ${{ steps.decide.outputs.base }}
      archive: ${{ steps.decide.outputs.archive }}
      resume: ${{ steps.decide.outputs.resume }}
      sets: ${{ steps.decide.outputs.sets }}
      config: ${{ steps.decide.outputs.config }}
      device: ${{ steps.decide.outputs.device }}
    steps:
      - id: decide
        uses: actions/github-script@v7
        env:
          INPUT_SETS: ${{ inputs.sets }}
          INPUT_CONFIG: ${{ inputs.config }}
          INPUT_DEVICE: ${{ inputs.device }}
          INPUT_ARCHIVE: ${{ inputs.archive }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const full = `${owner}/${repo}`;
            let run = false, commit = '', pr = '', base = '', archive = false, resume = false;
            let sets = 'acopf,cops,mittelmann,cutest', config = 'default', device = 'cpu,cuda';
            const labeled = p => p.labels.some(l => l.name === 'benchmark');
            if (context.eventName === 'workflow_dispatch') {
              run = true; commit = context.sha; archive = process.env.INPUT_ARCHIVE === 'true';
              sets = process.env.INPUT_SETS; config = process.env.INPUT_CONFIG; device = process.env.INPUT_DEVICE;
            } else if (context.eventName === 'workflow_run') {
              const wr = context.payload.workflow_run;
              if (wr.conclusion === 'success' && wr.head_repository.full_name === full) {
                commit = wr.head_sha;
                if (wr.event === 'push' && wr.head_branch === 'master') {
                  run = true; archive = true;
                }
              }
            } else if (context.eventName === 'pull_request') {
              const p = context.payload.pull_request;
              const requested = context.payload.action === 'synchronize' || context.payload.label.name === 'benchmark';
              if (requested && labeled(p) && p.head.repo.full_name === full) {
                run = true; commit = p.head.sha; pr = String(p.number); base = p.base.sha;
                const { data: head } = await github.rest.repos.getCommit({ owner, repo, ref: commit });
                resume = head.commit.message.includes('[benchmark-continue]');
                // a benchmark of this pull request that is running goes on undisturbed
                if (resume) {
                  const { data: active } = await github.rest.actions.listWorkflowRuns({
                    owner, repo, workflow_id: 'benchmark.yml', branch: p.head.ref, status: 'in_progress',
                  });
                  const running = active.workflow_runs.filter(r => r.id !== context.runId);
                  if (running.length > 0) {
                    run = false;
                    core.info(`leaving run ${running[0].id} as it is`);
                    // the jobs of this workflow read as skipped: say on the commit where the benchmark is
                    await github.rest.repos.createCommitStatus({
                      owner, repo, sha: commit, state: 'success', context: 'benchmark continues',
                      description: `Still running on ${running[0].head_sha.slice(0, 8)}`,
                      target_url: running[0].html_url,
                    });
                  }
                }
              }
            }
            core.info(`run=${run} commit=${commit} pr=${pr} base=${base} archive=${archive}`);
            core.setOutput('run', String(run)); core.setOutput('commit', commit); core.setOutput('pr', pr);
            core.setOutput('base', base); core.setOutput('archive', String(archive));
            core.setOutput('resume', String(resume));
            core.setOutput('sets', sets); core.setOutput('config', config); core.setOutput('device', device);
      # the link to the report, as soon as a benchmark of a pull request starts
      - name: Link the report
        if: steps.decide.outputs.pr != '' && vars.BENCHMARK_REPORT_URL != ''
        uses: actions/github-script@v7
        env:
          PR: ${{ steps.decide.outputs.pr }}
          URL: ${{ vars.BENCHMARK_REPORT_URL }}
        with:
          script: |
            const marker = '<!-- madnlp-benchmark -->';
            const issue_number = Number(process.env.PR);
            const body = `${marker}\n[Benchmark report](${process.env.URL}/pr-${issue_number}/)`;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }

  run:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    permissions:
      contents: read
    # One run at a time per pull request (a newer request replaces it) and one at a time for
    # master.
    concurrency:
      group: benchmark-${{ needs.gate.outputs.pr != '' && format('pr-{0}', needs.gate.outputs.pr) || github.event_name == 'workflow_run' && 'master' || github.run_id }}
      cancel-in-progress: ${{ needs.gate.outputs.pr != '' }}
    runs-on: benchmark
    timeout-minutes: 4320
    env:
      # outside the checkout, so that if the runner is lost a new run of this commit resumes
      KEEP: ${{ github.workspace }}/../../madnlp-benchmark/${{ needs.gate.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.commit }}
          # the report looks up the archived results of an ancestor
          fetch-depth: 0
      - uses: julia-actions/install-juliaup@v2
        with:
          channel: '1'
      - name: Instantiate
        env:
          JULIA_PKG_PRECOMPILE_AUTO: 0
        # the licensed HSL_jll of the runner, as in the `test-hsl` job
        run: julia --startup-file=no --project=benchmark -e 'using Pkg; Pkg.Registry.update(); Pkg.develop(path = "/home/action-runner/HSL_jll.jl.v2025.7.21"); Pkg.instantiate()'
      - name: Check the machine
        run: |
          # results a cancelled or lost run left behind
          find "$(dirname "$KEEP")" -mindepth 1 -maxdepth 1 -mtime +7 -exec rm -rf {} + 2>/dev/null || true
          free -g; df -h "$HOME" .; nproc; nvidia-smi -L
          unset CUDA_VISIBLE_DEVICES
          for device in cpu cuda; do
            julia --startup-file=no --project=benchmark benchmark/run.jl smoke --device=$device --workers=1 --wall=120 \
              --only=case14_ieee_polar,catmix_100 --out="$RUNNER_TEMP/preflight-$device"
            grep -qE '^[^,]+,1,' "$RUNNER_TEMP/preflight-$device/smoke_default.csv"
          done
          grep -q Ma57Solver "$RUNNER_TEMP/preflight-cpu/smoke_default.csv.meta.toml"
          grep -q 'hsl_version = "2025.7.21"' "$RUNNER_TEMP/preflight-cpu/smoke_default.csv.meta.toml"
      - name: Run
        env:
          SETS: ${{ needs.gate.outputs.sets }}
          CONFIG: ${{ needs.gate.outputs.config }}
          DEVICE: ${{ needs.gate.outputs.device }}
          PR: ${{ needs.gate.outputs.pr }}
          COMMIT: ${{ needs.gate.outputs.commit }}
          BASE: ${{ needs.gate.outputs.base }}
          RESUME: ${{ needs.gate.outputs.resume }}
          # where a server outside CI picks up the results to build the report; empty for none
          LIVE: ${{ vars.BENCHMARK_LIVE_DIR }}
        run: |
          # a runner may be restricted to one GPU; a benchmark uses every GPU of the machine
          echo "CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES-unset}"
          unset CUDA_VISIBLE_DEVICES
          nvidia-smi -L
          # [benchmark-continue]: take over the latest results kept for this pull request
          if [ "$RESUME" = true ] && [ -n "$PR" ] && [ ! -e "$KEEP" ]; then
            previous=$(grep -lx "$PR" "$(dirname "$KEEP")"/*/.pr 2>/dev/null | xargs -r ls -t | head -1)
            [ -z "$previous" ] || mv "$(dirname "$previous")" "$KEEP"
          fi
          mkdir -p "$KEEP"
          [ -z "$PR" ] || echo "$PR" > "$KEEP/.pr"
          # the results so far go to the server every 30 s; run.json is replaced last, which marks a complete copy
          publish() {
            rsync -a --exclude='*.tmp' --exclude=.pr --exclude=run.json "$KEEP"/ "$LIVE/pr-$PR"/
            printf '{"repository":"%s","pr":"%s","commit":"%s","base":"%s","run":"%s","state":"%s"}\n' \
              "$GITHUB_REPOSITORY" "$PR" "$COMMIT" "$BASE" "$GITHUB_RUN_ID" "$1" > "$LIVE/pr-$PR/.run.json"
            mv "$LIVE/pr-$PR/.run.json" "$LIVE/pr-$PR/run.json"
          }
          if [ -n "$PR" ] && [ -n "$LIVE" ]; then
            mkdir -p "$LIVE/pr-$PR"
            ( while true; do publish running; sleep 30; done ) &
            publisher=$!
          fi
          rc=0
          julia --startup-file=no --project=benchmark benchmark/run.jl "$SETS" \
            --device="$DEVICE" --config="$CONFIG" --wall=$WALL --root="$KEEP" < /dev/null || rc=$?
          # the Ipopt reference of this version of the benchmark, if the archive has none
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' benchmark/Project.toml)
          git fetch --quiet origin "$ARCHIVE_BRANCH" || true
          if [ -z "$(git ls-tree FETCH_HEAD "ipopt/$version/" 2>/dev/null)" ]; then
            julia --startup-file=no --project=benchmark benchmark/run.jl "$SETS" \
              --device=cpu --config=ipopt --wall=$WALL --root="$KEEP" < /dev/null || rc=$?
          fi
          if [ -n "${publisher:-}" ]; then
            kill "$publisher"
            publish "$([ $rc = 0 ] && echo finished || echo failed)"
          fi
          exit $rc
      - name: Collect the results
        if: always()
        run: mkdir -p benchmark/results && cp -r "$KEEP"/. benchmark/results/ || true
      # also after a failed or timed-out leg: the result files are written case by case
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: benchmark/results
      - name: Remove the kept results
        run: rm -rf "$KEEP"

  # Archive the results and comment on the pull request. Runs the scripts of the default
  # branch on the result files of the `run` job, so that nothing from the benchmarked commit
  # executes with this job's token. The one exception is the fallback step below, for a
  # default branch without benchmark/: it runs the scripts of the benchmarked commit, which the
  # gate has restricted to branches of this repository.
  publish:
    needs: [gate, run]
    # also after a failed leg, so that the comment does not stay at "in progress"
    if: always() && needs.gate.outputs.run == 'true' && needs.run.result != 'skipped' && needs.run.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      # the pull request that adds benchmark/ is published with its own scripts
      - name: Use the scripts of the benchmarked commit if the default branch has none
        run: |
          if [ ! -f benchmark/compare.jl ]; then
            git fetch --quiet origin ${{ needs.gate.outputs.commit }}
            git checkout --quiet ${{ needs.gate.outputs.commit }}
          fi
      - uses: actions/download-artifact@v4
        with:
          name: results
          path: results
      - uses: julia-actions/install-juliaup@v2
        with:
          channel: '1'
      - name: Instantiate
        env:
          JULIA_PKG_PRECOMPILE_AUTO: 0
        run: julia --startup-file=no --project=benchmark -e 'using Pkg; Pkg.instantiate()'
      - name: Summarize
        run: julia --startup-file=no --project=benchmark benchmark/summary.jl results/*/ --wall=$WALL | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Archive
        if: needs.gate.outputs.archive == 'true' && needs.run.result == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          julia --startup-file=no --project=benchmark benchmark/archive.jl results --commit=${{ needs.gate.outputs.commit }} --wall=$WALL
      - name: Archive the Ipopt reference
        if: needs.run.result == 'success' && hashFiles('results/*/*_ipopt.csv') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          julia --startup-file=no --project=benchmark benchmark/archive.jl "$(dirname results/*/acopf_ipopt.csv)" --ipopt-reference
      - name: Compare with the base commit
        if: needs.gate.outputs.pr != ''
        # without archived results for the base, the comparison prints this run's table alone
        run: >-
          julia --startup-file=no --project=benchmark benchmark/compare.jl ${{ needs.gate.outputs.base }} results --wall=$WALL
          --candidate-label="\`$(echo ${{ needs.gate.outputs.commit }} | cut -c1-8)\` (this pull request)" > comment.md
      - name: Say if the run did not finish
        if: needs.gate.outputs.pr != '' && needs.run.result != 'success'
        run: sed -i '1a **The run did not finish; these are the instances it reached.**\n' comment.md
      - name: Link the report
        if: needs.gate.outputs.pr != '' && vars.BENCHMARK_REPORT_URL != ''
        env:
          URL: ${{ vars.BENCHMARK_REPORT_URL }}/pr-${{ needs.gate.outputs.pr }}/
        run: |
          printf '[Benchmark report](%s)\n' "$URL" > comment.md
      - name: Comment
        if: needs.gate.outputs.pr != ''
        uses: actions/github-script@v7
        env:
          PR: ${{ needs.gate.outputs.pr }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- madnlp-benchmark -->';
            const body = marker + '\n' + fs.readFileSync('comment.md', 'utf8').trimEnd();
            const issue_number = Number(process.env.PR);
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
