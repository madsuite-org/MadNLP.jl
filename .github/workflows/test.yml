name: build

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 0 * * 0'

permissions:
  actions: write
  contents: read

jobs:
  test-madnlp:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: ['1']
        julia-arch: [x64]
        os: [ubuntu-latest,macos-latest,windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/install-juliaup@v2
        with:
          channel: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: test MadCore, MadNLPCore
        # tested on their own, without MadNLP; once is enough
        if: matrix.os == 'ubuntu-latest'
        run: |
          julia --project=./MadCore --color=yes -e 'using Pkg; Pkg.Registry.update(); Pkg.test(coverage=true)'
          julia --project=./MadNLPCore --color=yes -e 'using Pkg; Pkg.Registry.update(); Pkg.test(coverage=true)'
      - name: test MadNLP
        shell: julia --project=./MadNLP --color=yes {0}
        run: |
          using Pkg
          Pkg.Registry.update()
          Pkg.test(coverage=true)
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: MadNLP/src,MadNLP/ext,MadCore/src,MadCore/ext,MadNLPCore/src
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # The org-wide token cannot imply a repository; the slug says
          # which repo this upload is for.
          slug: ${{ github.repository }}
  test-hsl:
    runs-on:
      labels: hsl
    strategy:
      matrix:
        julia-version: ['1']
        hsl-version: ['2024.11.28', '2025.7.21']
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/install-juliaup@v2
        with:
          channel: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v1
      - name: Set HSL_VERSION as environment variable
        run: echo "HSL_VERSION=${{ matrix.hsl-version }}" >> $GITHUB_ENV
      - name: Setup test environment
        shell: julia --project=./MadNLP/test/HSL --color=yes {0}
        run: |
          using Pkg
          Pkg.Registry.update()
          path_HSL_jll = "/home/action-runner/HSL_jll.jl.v" * ENV["HSL_VERSION"]
          Pkg.develop([
              PackageSpec(path="./MadCore"),
              PackageSpec(path="./MadNLPCore"),
              PackageSpec(path="./MadNLP"),
              PackageSpec(path="./MadNLPTests"),
              PackageSpec(path=path_HSL_jll),
          ])
      - name: test HSL solvers
        run: julia --project=./MadNLP/test/HSL --code-coverage=user --color=yes MadNLP/test/HSL/runtests.jl
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: MadCore/ext,MadNLP/ext
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # The org-wide token cannot imply a repository; the slug says
          # which repo this upload is for.
          slug: ${{ github.repository }}
  # need to run one on cuda and one on amdgpu
  test-gpu:
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1']
        gpu: [cuda, amdgpu]
    runs-on:
      - self-hosted
      - ${{ matrix.gpu }}
    continue-on-error: ${{ matrix.gpu == 'amdgpu' }}
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/install-juliaup@v2
        with:
          channel: ${{ matrix.julia-version }}
      - name: Setup test environment
        shell: julia --project=./MadCoreGPU/test --color=yes {0}
        run: |
          using Pkg
          Pkg.Registry.update()
          Pkg.develop([
              PackageSpec(path="./MadCore"),
              PackageSpec(path="./MadNLPCore"),
              PackageSpec(path="./MadNLP"),
              PackageSpec(path="./MadCoreGPU"),
              PackageSpec(path="./MadNLPTests"),
          ])
      # Julia 1.13's Pkg auto-precompile looks up changed indirect deps by name
      # and fails with "Unknown package"; the test step precompiles on load.
      - name: Add cuMadNLP
        if: matrix.gpu == 'cuda'
        env:
          JULIA_PKG_PRECOMPILE_AUTO: 0
        shell: julia --project=./MadCoreGPU/test --color=yes {0}
        run: |
          using Pkg
          Pkg.add(["CUDA", "CUDSS"])
          Pkg.develop(path="./cuMadNLP")
      - name: Add rocMadNLP
        if: matrix.gpu == 'amdgpu'
        env:
          JULIA_PKG_PRECOMPILE_AUTO: 0
        shell: julia --project=./MadCoreGPU/test --color=yes {0}
        run: |
          using Pkg
          Pkg.add("AMDGPU")
          Pkg.develop(path="./rocMadNLP")
      - name: test MadCoreGPU
        env:
          MADNLP_GPU_BACKEND: ${{ matrix.gpu }}
        run: julia --project=./MadCoreGPU/test --code-coverage=user --color=yes MadCoreGPU/test/runtests.jl
      - name: test cuMadNLP
        if: matrix.gpu == 'cuda'
        run: julia --project=./MadCoreGPU/test --code-coverage=user --color=yes cuMadNLP/test/runtests.jl
      - name: test MadNLPGPU
        if: matrix.gpu == 'cuda'
        shell: julia --project=./MadCoreGPU/test --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(path="./MadNLPGPU")
          include(joinpath(pwd(), "MadNLPGPU", "test", "runtests.jl"))
      - name: test rocMadNLP
        if: matrix.gpu == 'amdgpu'
        run: julia --project=./MadCoreGPU/test --code-coverage=user --color=yes rocMadNLP/test/runtests.jl
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: MadCoreGPU/src,MadCoreGPU/ext,MadNLPCore/ext,cuMadNLP/src,rocMadNLP/src
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # The org-wide token cannot imply a repository; the slug says
          # which repo this upload is for.
          slug: ${{ github.repository }}
